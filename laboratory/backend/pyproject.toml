[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raps-laboratory"
version = "0.1.0"
description = "Reproducible asynchronous multi-agent testing laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "spade==4.1.4", "numpy>=2,<3", "matplotlib>=3.9,<4",
  "pyyaml>=6,<7", "python-multipart>=0.0.18", "sqlalchemy[asyncio]>=2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "hypothesis>=6,<7", "httpx>=0.27,<1", "ruff>=0.14,<1"]

[project.scripts]
cp1 = "cp1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["spade: real SPADE and XMPP integration"]
